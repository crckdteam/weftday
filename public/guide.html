<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'">
<title>Weftday guide: five things to know</title>
<meta name="description" content="A short walkthrough of Weftday: connect your calendars, add tasks in one line, plan your day, prepare for meetings, keep notes, share your free times.">
<meta name="theme-color" content="#111613" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#edf1ea" media="(prefers-color-scheme: light)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="site.css">
<style>
  body { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; overflow-x: hidden; }
  header, main, footer { width: min(1180px, 100%); margin: 0 auto; padding: 0 clamp(18px, 4vw, 44px); }
  header { display: flex; align-items: center; gap: 6px; height: 72px; }
  header .sp { flex: 1; }
  main { display: grid; grid-template-columns: 216px minmax(0, 1fr) minmax(0, 1.05fr); gap: clamp(22px, 4vw, 56px); align-items: center; padding-top: 6px; padding-bottom: 6px; }

  /* the list of steps */
  nav { display: grid; gap: 2px; align-self: center; }
  nav button { display: flex; align-items: center; gap: 11px; padding: 7px 9px; border: 0; border-radius: 9px; background: transparent; color: var(--muted);
    font: inherit; font-size: 13.5px; font-weight: 550; text-align: left; cursor: pointer; transition: background .15s, color .15s; }
  nav button i { width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700;
    border: 1px solid var(--line); font-variant-numeric: tabular-nums; transition: background .2s, color .2s, border-color .2s; }
  nav button:hover { color: var(--text); background: color-mix(in srgb, var(--muted) 9%, transparent); }
  nav button.on { color: var(--text); background: var(--panel); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
  nav button.on i { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  nav button.done i { background: color-mix(in srgb, var(--c2) 16%, transparent); border-color: transparent; color: var(--c2); }

  /* the step itself */
  .step { display: grid; gap: 16px; align-content: center; min-width: 0; }
  .count { font-size: 12.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-variant-numeric: tabular-nums; }
  h1 { font-size: clamp(30px, 3.6vw, 46px); line-height: 1.05; letter-spacing: -.03em; font-weight: 720; margin: 0; text-wrap: balance; }
  .say { font-size: clamp(15.5px, 1.25vw, 17.5px); line-height: 1.6; color: var(--muted); margin: 0; max-width: 31em; text-wrap: pretty; }
  .say b { color: var(--text); font-weight: 600; }
  .say kbd, .tip kbd { font: inherit; font-size: .86em; font-weight: 650; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); border-bottom-width: 2px; background: var(--panel); color: var(--text); white-space: nowrap; }
  .tip { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; color: var(--muted);
    border: 1px dashed var(--line); max-width: 34em; }
  .tip svg { flex: none; color: var(--amber); margin-top: 2px; }
  .move { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
  .move .keys { margin-left: 6px; font-size: 12.5px; color: var(--muted); }
  .swap { animation: swap .45s var(--ease) both; }
  @keyframes swap { from { opacity: 0; transform: translateY(10px); } }

  /* the drawing for the step */
  .art { position: relative; min-width: 0; display: grid; place-items: center; }
  .art::before { content: ''; position: absolute; inset: -8% -6%; background: radial-gradient(closest-side, var(--glow), transparent 72%); pointer-events: none; }
  .art .wf { position: relative; width: min(100%, 470px); padding: 16px; display: grid; gap: 11px; }
  .art .row { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .art .sp { flex: 1; }
  .art p { margin: 0; font-size: 12.5px; line-height: 1.45; }
  .art .mut { color: var(--muted); }
  .art b { font-size: 13px; }
  .box { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 8px 0 11px; border-radius: 11px; border: 1px solid var(--accent); background: var(--panel);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); font-size: 13px; font-weight: 550; }
  .box span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .box i { width: 26px; height: 26px; border-radius: 8px; flex: none; display: grid; place-items: center; font-style: normal; color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .mini { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .mini.go { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .grid5 { position: relative; height: 150px; display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--line2); border-radius: 10px; overflow: hidden;
    background: repeating-linear-gradient(to bottom, transparent 0 24px, var(--line2) 24px 25px); }
  .grid5 > div { position: relative; border-left: 1px solid var(--line2); }
  .grid5 > div:first-child { border-left: 0; }
  .grid5 .slot { position: absolute; left: 3px; right: 3px; border-radius: 6px; border: 1.5px dashed var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .tiles3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tiles3 span { display: grid; justify-items: center; gap: 4px; padding: 9px 4px 7px; border-radius: 11px; border: 1px solid var(--line); font-size: 11px; font-weight: 600; }
  .tiles3 span.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .tiles3 svg { color: var(--accent); }
  .lines { display: grid; grid-template-columns: 74px 1fr; gap: 6px 10px; align-items: start; }
  .note { border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; background: var(--bg); display: grid; gap: 4px; }
  .qr { width: 104px; height: 104px; border-radius: 12px; background:
      conic-gradient(from 90deg at 2px 2px, transparent 90deg, var(--text) 0) 0 0 / 13px 13px,
      linear-gradient(var(--panel), var(--panel)); border: 8px solid var(--panel); outline: 1px solid var(--line); opacity: .9; }
  .phone { width: 92px; height: 150px; border-radius: 18px; border: 2px solid var(--line); padding: 12px 8px; display: grid; gap: 6px; align-content: start; background: var(--bg); }
  .flow { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; text-align: center; }
  .flow .node { border: 1px solid var(--line); border-radius: 14px; padding: 14px 8px; display: grid; gap: 6px; justify-items: center; font-size: 12.5px; font-weight: 650; }
  .flow .wire { display: grid; gap: 4px; justify-items: center; font-size: 10.5px; color: var(--muted); }
  .flow .wire i { width: 64px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--c2)); }
  .no { text-align: center; font-size: 12px; color: var(--muted); text-decoration: line-through; text-decoration-color: var(--now); }

  footer { display: flex; align-items: center; gap: 14px; min-height: 60px; padding-bottom: 12px; font-size: 12.5px; color: var(--muted); }
  .track { flex: 1; height: 3px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .track i { display: block; height: 100%; width: 10%; border-radius: 99px; background: var(--accent); transition: width .45s var(--ease); }

  @media (max-width: 980px) {
    main { grid-template-columns: 1fr; gap: 20px; align-items: start; padding-top: 0; }
    nav { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; gap: 4px; padding-bottom: 4px; scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
    nav button span { display: none; }
    nav button { padding: 4px; }
    nav button.on { background: transparent; box-shadow: none; }
    .art { order: 2; }
    .step { order: 1; }
    .art .wf { width: min(100%, 520px); }
    .move .keys { display: none; }
    header .hide-s { display: none; }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="./"><img src="icon.svg" alt="">Weftday</a>
  <span class="sp"></span>
  <a class="btn small quiet hide-s" href="https://crckdteam.github.io/weftday/">Website</a>
  <a class="btn small quiet hide-s" href="./?demo">Try a demo</a>
  <a class="btn small" href="./">Open Weftday</a>
</header>

<main>
  <nav id="rail" aria-label="Steps"></nav>

  <section class="step" id="step" aria-live="polite">
    <span class="count" id="count"></span>
    <h1 id="title"></h1>
    <p class="say" id="say"></p>
    <div class="tip"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.900c.6.500 1 1.200 1 2.100h5c0-.900.4-1.600 1-2.100A6 6 0 0 0 12 3z"/></svg><span id="tip"></span></div>
    <div class="move">
      <button class="btn" id="back" type="button">Back</button>
      <button class="btn primary" id="next" type="button">Next</button>
      <span class="keys">or use <kbd>←</kbd> <kbd>→</kbd></span>
    </div>
  </section>

  <section class="art" id="art" aria-hidden="true"></section>
</main>

<footer>
  <span id="where"></span>
  <span class="track"><i id="bar"></i></span>
  <a href="./" style="text-decoration:none">Skip to the app</a>
</footer>

<script src="guide.js"></script>
</body>
</html>
