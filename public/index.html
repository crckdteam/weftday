<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- What this page may load and talk to. Scripts only from Weftday's own files, so text from an invite or
       an AI answer can never run as code. A new AI or search service must be added to connect-src here. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: blob:; media-src 'self' blob:; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://generativelanguage.googleapis.com https://api.anthropic.com https://api.groq.com https://openrouter.ai https://api.mistral.ai https://api.cohere.ai https://api.openai.com https://api.perplexity.ai https://api.x.ai https://api.deepseek.com https://api.tavily.com https://api.firecrawl.dev https://api.linkup.so https://google.serper.dev https://s.jina.ai https://en.wikipedia.org http://localhost:11434 http://127.0.0.1:11434; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'">
  <title>Weftday</title>
  <meta name="theme-color" content="#edf1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111613" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Weftday">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="side">
      <div id="sideGrip" title="Drag to make this panel wider or narrower. Double-click to put it back."></div>
      <div class="brand">
        <button type="button" id="brandHome" title="Home"><img src="icon.svg" alt="" width="22" height="22"><span>Weftday</span></button>
        <span id="demoTag" hidden>Sample data</span>
        <button id="closeSide" class="icon only-mobile" aria-label="Close menu">✕</button>
      </div>
      <button type="button" id="recBtn" data-act="record" title="Record a meeting, your screen or your voice"><i aria-hidden="true"></i><span>Record</span><kbd>R</kbd></button>
      <nav id="mainNav" aria-label="Sections">
        <button type="button" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"/></svg><span>Home</span></button>
        <button type="button" data-nav="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
        <button type="button" data-nav="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h9l4 4v13H6z"/><path d="M15 3.5v4h4M9 12h7M9 15.5h7M9 8.5h3"/></svg><span>Notes</span></button>
        <button type="button" data-nav="recordings" data-act="recordings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10.5 5-3v9l-5-3z"/></svg><span>Recordings</span></button>
        <button type="button" data-nav="people" data-act="people"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 19.5c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5M16 5.2a3.5 3.5 0 0 1 0 6.6M18.5 14.6c1.700.9 2.700 2.5 3 4.9"/></svg><span>People</span></button>
      </nav>
      <form id="quick" autocomplete="off">
        <div class="qbox">
          <svg class="qplus" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <div class="qfield">
            <input id="quickInput" enterkeyhint="done" aria-label="Add a task. For example: gym tomorrow 7am 1h">
            <span class="qph" id="quickPh" aria-hidden="true">Add a task</span>
          </div>
          <button type="button" id="quickAi" aria-label="Let AI turn this into tasks" title="Say it in your own words and let AI turn it into tasks (Shift+Enter)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3.5l1.9 5.1L18 10.5l-5.1 1.9L11 17.5l-1.9-5.1L4 10.5l5.1-1.9z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>
          </button>
        </div>
        <div id="quickHint" hidden></div>
      </form>
      <div id="sideBody"></div>
      <div class="sideFoot">
        <button id="connect" class="btn">+ Connect Google account</button>
        <button id="teamsBtn" class="btn ghost">+ Add Teams calendar</button>
        <div class="footrow">
          <button id="settingsBtn" class="btn ghost"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.800 1.800M16.6 16.6l1.800 1.800M5.6 18.4l1.800-1.800M16.6 7.4l1.800-1.800"/></svg><span>Settings</span></button>
          <button id="helpBtn" class="btn ghost no-mobile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/></svg><span>Shortcuts</span></button>
          <a class="btn ghost" href="guide.html" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg><span>Guide</span></a>
        </div>
      </div>
    </aside>

    <main>
      <header id="bar">
        <button id="menu" class="icon only-mobile" aria-label="Open menu">☰</button>
        <button id="todayBtn" class="btn">Today</button>
        <button id="prev" class="icon" aria-label="Previous">‹</button>
        <button id="next" class="icon" aria-label="Next">›</button>
        <h1 id="title"></h1>
        <span id="status"></span>
        <button id="searchBtn" class="icon" aria-label="Search" title="Search ( / )">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        </button>
        <button id="zoneBtn" class="icon no-mobile" aria-label="Second time zone">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.9 5.2 3.9 8.5s-1.3 6.1-3.9 8.5c-2.6-2.4-3.9-5.2-3.9-8.5S9.400 5.900 12 3.500z"/></svg><span></span>
        </button>
        <div class="seg" id="viewSeg">
          <button data-view="day">Day</button>
          <button data-view="week">Week</button>
          <button data-view="month">Month</button>
          <button data-view="list">List</button>
        </div>
        <button id="newEvent" class="btn primary">+ Event</button>
      </header>
      <div id="grid">
        <div id="gridHead"></div>
        <div id="gridBody"></div>
      </div>
      <div id="month" hidden></div>
      <div id="list" hidden></div>
      <div id="notes" hidden></div>
      <div id="home" hidden></div>
      <button id="fab" class="only-mobile" aria-label="New task">+</button>
    </main>
  </div>

  <dialog id="dlg"></dialog>
  <div id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
